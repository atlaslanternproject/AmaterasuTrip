<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Amaterasu Trip: organizza i tuoi viaggi con gli altri viaggiatori. Attività, budget, spese e note in un unico posto.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1A0B08">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Amaterasu Trip">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->


  <title>Amaterasu Trip</title>
  <link rel="manifest" href="manifest.json">
<script src="google_maps_loader.js"></script>
  <script src="amaterasu_maps_bridge.js"></script>
<script src="amaterasu_bucket_photos.js"></script>
  <script src="amaterasu_place_info.js"></script>
  <script src="amaterasu_files.js"></script>
  <script src="amaterasu_time_zone.js"></script>
  <script src="amaterasu_drive_oauth.js"></script>
  <link rel="icon" type="image/png" href="favicon.png?v=19010">
  <style>
    /* Loading with the sun (Extra G): shown until the app draws its first
       page, then it fades out. Light CSS animation, no images to load. */
    html, body { margin: 0; background: #1A0B08; }
    #amaterasu-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 42%, #3A120D 0%, #1A0B08 62%);
      color: #F2E7D5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity 0.35s ease; z-index: 10;
    }
    #amaterasu-loading.done { opacity: 0; pointer-events: none; }
    .amaterasu-sun { position: relative; width: 84px; height: 84px; }
    .amaterasu-sun::before {
      content: ""; position: absolute; inset: 18px; border-radius: 50%;
      background: radial-gradient(circle, #E3A66C 0%, #E5482E 70%);
      box-shadow: 0 0 28px rgba(229, 72, 46, 0.55);
      animation: amaterasu-glow 2.4s ease-in-out infinite;
    }
    .amaterasu-sun::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: repeating-conic-gradient(rgba(227, 166, 108, 0.85) 0 6deg, transparent 6deg 30deg);
      -webkit-mask: radial-gradient(circle, transparent 36px, #000 37px, #000 41px, transparent 42px);
      mask: radial-gradient(circle, transparent 36px, #000 37px, #000 41px, transparent 42px);
      animation: amaterasu-turn 9s linear infinite;
    }
    .amaterasu-name { font-size: 15px; letter-spacing: 0.08em; color: #B7A99B; }
    @keyframes amaterasu-glow { 50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(229, 72, 46, 0.75); } }
    @keyframes amaterasu-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .amaterasu-sun::before, .amaterasu-sun::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="amaterasu-loading" role="progressbar" aria-label="Amaterasu Trip">
    <div class="amaterasu-sun"></div>
    <div class="amaterasu-name">AMATERASU TRIP</div>
  </div>
  <script>
    // Hide the sun when the app shows its first real page (sign-in, home or
    // a trip): initial loading complete. A safety timer removes it anyway.
    (() => {
      const hide = () => {
        const el = document.getElementById('amaterasu-loading');
        if (!el || el.classList.contains('done')) return;
        el.classList.add('done');
        setTimeout(() => el.remove(), 400);
      };
      // Called by the app when the first real page is shown.
      window.amaterasuAppReady = hide;
      setTimeout(hide, 15000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Installable app (no offline): register the minimal service worker.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('amaterasu_sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
